<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time WebSocket Chat</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; }
        #chat-container { width: 400px; margin-top: 50px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #status { font-size: 0.8em; margin-bottom: 10px; color: gray; }
        #status.connected { color: green; font-weight: bold; }
        #messages { height: 300px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; display: flex; flex-direction: column; }
        .message { margin-bottom: 8px; padding: 8px; border-radius: 5px; background: #e1ffc7; align-self: flex-start; max-width: 80%; }
        .input-area { display: flex; gap: 5px; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div id="chat-container">
        <h2>Live Chat</h2>
        <div id="status">Connecting to server...</div>
        
        <div id="messages">
            </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // 1. Connect to the server
        const socket = new WebSocket('ws://localhost:8080');
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        const inputField = document.getElementById('messageInput');

        // 2. Handle Connection Open
        socket.onopen = () => {
            statusDiv.innerText = "● Connected to Server";
            statusDiv.classList.add('connected');
            console.log("WebSocket Connection Established");
        };

        // 3. Handle Incoming Messages
        socket.onmessage = (event) => {
            const newMessage = document.createElement('div');
            newMessage.className = 'message';
            newMessage.innerText = event.data;
            messagesDiv.appendChild(newMessage);
            
            // Auto-scroll to the bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };

        // 4. Handle Errors/Close
        socket.onclose = () => {
            statusDiv.innerText = "○ Disconnected (Is the server running?)";
            statusDiv.classList.remove('connected');
        };

        // 5. Send Message Function
        function sendMessage() {
            const message = inputField.value;
            if (message && socket.readyState === WebSocket.OPEN) {
                socket.send(message);
                inputField.value = '';
            } else if (socket.readyState !== WebSocket.OPEN) {
                alert("Cannot send: Not connected to server.");
            }
        }

        // Allow pressing "Enter" to send
        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
